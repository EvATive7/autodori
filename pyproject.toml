[project]
name = "autodori-agent"
version = "1.0.21"
description = "autodori MaaFramework Agent Server"
requires-python = ">=3.11"
dependencies = [
    "diskcache>=5.6.3",
    "fuzzywuzzy>=0.18.0",
    "ld-ipc.py>=0.0.2",
    "maafw>=5.8.0",
    "minitouch.py>=1.1.3",
    "mumuipc.py>=0.0.3",
    "numpy>=2.4.6",
    "peewee>=4.2.2",
    "pillow>=12.3.0",
    "python-levenshtein>=0.27.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
build = [
    "pyinstaller>=6.21.0",
]
